<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#EAB308" stroke-width="4" stroke-opacity="0.3" />

  <!-- Stage Glow -->
  <circle cx="256" cy="240" r="150" fill="#EAB308" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="340" cy="180" r="90" fill="#EC4899" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Google TV / Stage Spotlight Rays -->
  <path d="M256 70 L330 380 L182 380 Z" fill="#EAB308" opacity="0.08" />

  <!-- Microphone Mesh Head -->
  <rect x="206" y="120" width="100" height="150" rx="50" fill="url(#goldGrad)" filter="url(#neonGlow)" />
  
  <!-- Microphone Grid Lines -->
  <line x1="206" y1="160" x2="306" y2="160" stroke="#713F12" stroke-width="4" stroke-linecap="round" />
  <line x1="206" y1="195" x2="306" y2="195" stroke="#713F12" stroke-width="4" stroke-linecap="round" />
  <line x1="206" y1="230" x2="306" y2="230" stroke="#713F12" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="120" x2="256" y2="270" stroke="#713F12" stroke-width="4" stroke-linecap="round" />

  <!-- Microphone Cradle & Handle -->
  <path d="M186 210 C186 290 326 290 326 210" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="290" x2="256" y2="360" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="206" y1="360" x2="306" y2="360" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

  <!-- Soho Star Accent -->
  <polygon points="370,110 382,138 412,140 389,160 396,190 370,174 344,190 351,160 328,140 358,138" fill="url(#goldGrad)" filter="url(#neonGlow)" />

  <!-- TV Antenna / Live On-Air Pill -->
  <rect x="166" y="405" width="180" height="42" rx="21" fill="url(#neonPink)" />
  <circle cx="194" cy="426" r="6" fill="#FFFFFF" />
  <text x="254" y="432" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="3">GOOGLE TV</text>
</svg>
