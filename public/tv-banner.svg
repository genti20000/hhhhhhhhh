<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E14" />
      <stop offset="40%" stop-color="#1A1528" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- TV Banner Background -->
  <rect width="320" height="180" fill="url(#tvBg)" />
  <rect x="2" y="2" width="316" height="176" rx="12" fill="none" stroke="#EAB308" stroke-width="2" stroke-opacity="0.4" />

  <!-- Background decorative glows -->
  <circle cx="270" cy="90" r="70" fill="#EAB308" opacity="0.12" />
  <circle cx="50" cy="140" r="60" fill="#EC4899" opacity="0.15" />

  <!-- Left: Stylized Icon -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#12121A" stroke="#EAB308" stroke-width="2" />
    <!-- Mic icon -->
    <rect x="36" y="22" width="28" height="42" rx="14" fill="url(#goldBanner)" />
    <path d="M30 46 C30 68 70 68 70 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="68" x2="50" y2="82" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="82" x2="62" y2="82" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right: Title & Google TV Metadata -->
  <text x="140" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1">SINGSHOT</text>
  <text x="140" y="85" fill="#EAB308" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">LONDON KARAOKE CLUB</text>
  <text x="140" y="105" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">SOHO · LIVE STAGE TV</text>

  <!-- Badge -->
  <g transform="translate(140, 118)">
    <rect width="105" height="20" rx="10" fill="#E11D48" />
    <circle cx="10" cy="10" r="3.5" fill="#FFFFFF" />
    <text x="58" y="14" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1.5">GOOGLE TV</text>
  </g>
</svg>
